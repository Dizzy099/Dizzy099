<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="t d"><title id="t">Multi-provider AI workflow engine</title><desc id="d">Workflow graph brief to LLM to image to video. The LLM step uses a fallback chain: Claude returns 503, OpenAI answers, Gemini and DeepSeek stand by. A new model is enabled from an admin row, with no deploy.</desc><style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.in{animation:in .5s ease-out backwards}@keyframes in{from{opacity:0;transform:translateY(6px)}}@media (prefers-reduced-motion:reduce){.in{animation:none}.mv{display:none}}</style><rect x="1" y="1" width="758" height="378" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5" /><rect x="1" y="1" width="6" height="378" rx="3" fill="#0969da" stroke="none" stroke-width="1.5" /><text x="36" y="50" class="m" font-size="13" font-weight="700" fill="#0969da" text-anchor="start" letter-spacing="1.4">01 · TINGG.AI · IN PRODUCTION</text><text x="36" y="92" class="s" font-size="30" font-weight="800" fill="#1f2328" text-anchor="start" >Multi-provider</text><text x="36" y="128" class="s" font-size="30" font-weight="800" fill="#1f2328" text-anchor="start" >AI workflow engine</text><text x="36" y="178" class="s" font-size="17" font-weight="400" fill="#31373d" text-anchor="start" >Workflows are graphs of LLM, image</text><text x="36" y="204" class="s" font-size="17" font-weight="400" fill="#31373d" text-anchor="start" >and video steps. When a provider</text><text x="36" y="230" class="s" font-size="17" font-weight="400" fill="#31373d" text-anchor="start" >fails, the call falls through to the</text><text x="36" y="256" class="s" font-size="17" font-weight="400" fill="#31373d" text-anchor="start" >next one instead of failing the run.</text><rect x="36" y="324" width="63.400000000000006" height="28" rx="14" fill="#eaeef2" stroke="none" stroke-width="0" /><text x="67.7" y="343" class="m" font-size="13" font-weight="600" fill="#59636e" text-anchor="middle" >Django</text><rect x="107.4" y="324" width="63.400000000000006" height="28" rx="14" fill="#eaeef2" stroke="none" stroke-width="0" /><text x="139.10000000000002" y="343" class="m" font-size="13" font-weight="600" fill="#59636e" text-anchor="middle" >Celery</text><rect x="178.8" y="324" width="95.0" height="28" rx="14" fill="#eaeef2" stroke="none" stroke-width="0" /><text x="226.3" y="343" class="m" font-size="13" font-weight="600" fill="#59636e" text-anchor="middle" >4 LLM APIs</text><g transform="translate(404 34)"><rect x="0" y="24" width="88" height="42" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="2" /><text x="44" y="51" class="m" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle" >brief</text><rect x="122" y="24" width="88" height="42" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="2" /><text x="166" y="51" class="m" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle" >LLM</text><rect x="244" y="24" width="88" height="42" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="2" /><text x="288" y="51" class="m" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle" >image</text><rect x="244" y="150" width="88" height="42" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="2" /><text x="288" y="177" class="m" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle" >video</text><path d="M88 45L120 45" stroke="#59636e" stroke-width="2" fill="none"/><path d="M111.9 48.9L120 45L111.9 41.1" stroke="#59636e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M210 45L242 45" stroke="#59636e" stroke-width="2" fill="none"/><path d="M233.9 48.9L242 45L233.9 41.1" stroke="#59636e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M288 66L288 148" stroke="#59636e" stroke-width="2" fill="none"/><path d="M284.1 139.9L288 148L291.9 139.9" stroke="#59636e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M166 66L166 96" stroke="#59636e" stroke-width="2" fill="none"/><path d="M162.1 87.9L166 96L169.9 87.9" stroke="#59636e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="112" y="100" width="110" height="32" rx="16" fill="#ffffff" stroke="#cf222e" stroke-width="2" /><text x="128" y="121" class="m" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start" >claude</text><text x="212" y="121" class="m" font-size="12" font-weight="700" fill="#cf222e" text-anchor="end" >503</text><path d="M126 116H188" stroke="#cf222e" stroke-width="2"/><rect x="112" y="140" width="110" height="32" rx="16" fill="#ffffff" stroke="#1a7f37" stroke-width="2" /><text x="128" y="161" class="m" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start" >openai</text><text x="212" y="161" class="m" font-size="12" font-weight="700" fill="#1a7f37" text-anchor="end" >ok</text><rect x="112" y="180" width="110" height="32" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="2" /><text x="128" y="201" class="m" font-size="14" font-weight="600" fill="#59636e" text-anchor="start" >gemini</text><rect x="112" y="220" width="110" height="32" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="2" /><text x="128" y="241" class="m" font-size="14" font-weight="600" fill="#59636e" text-anchor="start" >deepseek</text><text x="0" y="128" class="m" font-size="13" font-weight="400" fill="#59636e" text-anchor="start" >fallback</text><text x="0" y="146" class="m" font-size="13" font-weight="400" fill="#59636e" text-anchor="start" >chain</text><path d="M62 140L106 140" stroke="#59636e" stroke-width="2" fill="none" stroke-dasharray="5 5"/><path d="M97.9 143.9L106 140L97.9 136.1" stroke="#59636e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M224 116 C 244 118, 244 150, 224 156" stroke="#1a7f37" stroke-width="2" fill="none" stroke-dasharray="4 4"/><circle class="mv" r="5" fill="#0969da"><animateMotion dur="3.6s" repeatCount="indefinite" path="M44 45H166V110H166V156H166V66H288V171"/></circle><text x="0" y="292" class="m" font-size="13" font-weight="400" fill="#59636e" text-anchor="start" >a new model = an admin row, not a deploy</text></g></svg>
