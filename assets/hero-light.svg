<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" role="img" aria-labelledby="t d"><title id="t">Awanish Mishra: I build the machinery behind AI products</title><desc id="d">Backend engineer in Noida, India. LLM routing, async pipelines and billing that adds up. About 200 REST endpoints, 4 LLM providers in one fallback chain, a suite of 2,600+ tests, and Lighthouse 70 to 94 on a live store.</desc><style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.in{animation:in .5s ease-out backwards}@keyframes in{from{opacity:0;transform:translateY(6px)}}@media (prefers-reduced-motion:reduce){.in{animation:none}.mv{display:none}}</style><rect x="1" y="1" width="758" height="348" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5" /><defs><pattern id="g" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#d0d7de"/></pattern></defs><rect x="470" y="2" width="288" height="214" rx="0" fill="url(#g)" stroke="none" stroke-width="1.5" /><text x="40" y="58" class="m in" font-size="14" font-weight="600" fill="#0969da" text-anchor="start" letter-spacing="1.5">AWANISH MISHRA  ·  BACKEND ENGINEER  ·  NOIDA, INDIA</text><text x="40" y="118" class="s in" font-size="46" font-weight="800" fill="#1f2328" text-anchor="start" style="animation-delay:.15s">I build the machinery</text><text x="40" y="170" class="s in" font-size="46" font-weight="800" fill="#1f2328" style="animation-delay:.3s">behind <tspan fill="#0969da">AI products.</tspan></text><text x="40" y="206" class="s in" font-size="19" font-weight="400" fill="#59636e" text-anchor="start" style="animation-delay:.45s">LLM routing · async pipelines · billing that adds up</text><path d="M540 70L620 110" stroke="#d0d7de" stroke-width="2"/><path d="M620 110L700 70" stroke="#d0d7de" stroke-width="2"/><path d="M620 110L62