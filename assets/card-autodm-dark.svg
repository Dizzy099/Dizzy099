<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="t d"><title id="t">Comment in, DM out: exactly once</title><desc id="d">A comment is claimed through a UNIQUE database column before the DM is sent. A duplicate delivery of the same comment is refused by the database. An hourly reconciler frees claims stuck for more than 30 minutes with no send.</desc><style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.in{animation:in .5s ease-out backwards}@keyframes in{from{opacity:0;transform:translateY(6px)}}@media (prefers-reduced-motion:reduce){.in{animation:none}.mv{display:none}}</style><rect x="1" y="1" width="758" height="378" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5" /><rect x="1" y="1" width="6" height="378" rx="3" fill="#f778ba" stroke="none" stroke-width="1.5" /><text x="36" y="50" class="m" font-size="13" font-weight="700" fill="#f778ba" text-anchor="start" letter-spacing="1.4">04 · CREATOR PLATFORM · AUTOMATION</text><text x="36" y="92" class="s" font-size="30" font-weight="800" fill="#e6edf3" text-anchor="start" >Comment in,</text><text x="36" y="128" class="s" font-size="30" font-weight="800" fill="#e6edf3" text-anchor="start" >DM out: exactly once</text><text x="36" y="178" class="s" font-size="17" font-weight="400" fill="#c9d1d9" text-anchor="start" >Instagram webhooks trigger replies</text><text x="36" y="204" class="s" font-size="17" font-weight="400" fill="#c9d1d9" text-anchor="start" >and DMs in real time, plus leads,</text><text x="36" y="230" class="s" font-size="17" font-weight="400" fill="#c9d1d9" text-anchor="start" >funnels and link analytics. Built</text><text x="36" y="256" class="s" font-size="17" font-weight="400" fill="#c9d1d9" text-anchor="start" >with several hundred unit tests.</text><rect x="36" y="324" width="126.60000000000001" height="28" rx="14" fill="#21262d" stroke="none" stroke-width="0" /><text x="99.30000000000001" y="343" class="m" font-size="13" font-weight="600" fill="#8b949e" text-anchor="middle" >Meta Graph API</text><rect x="170.60000000000002" y="324" width="79.2" height="28" rx="14" fill="#21262d" stroke="none" stroke-width="0" /><text x="210.20000000000002" y="343" class="m" font-size="13" font-weight="600" fill="#8b949e" text-anchor="middle" >webhooks</text><rect x="257.8" y="324" width="55.5" height="28" rx="14" fill="#21262d" stroke="none" stroke-width="0" /><text x="285.55" y="343" class="m" font-size="13" font-weight="600" fill="#8b949e" text-anchor="middle" >MySQL</text><g transform="translate(404 34)"><g><rect x="0" y="20" width="96" height="44" rx="12" fill="#0d1117" stroke="#f778ba" stroke-width="2" /><path d="M16 64l6 10 8-10" fill="#0d1117" stroke="#f778ba" stroke-width="2"/><text x="48.0" y="47" class="m" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="middle" >comment</text></g><rect x="128" y="14" width="96" height="58" rx="10" fill="#0d1117" stroke="#f0883e" stroke-width="2" /><text x="176" y="40" class="m" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="middle" >claim</text><text x="176" y="58" class="m" font-size="11" font-weight="700" fill="#f0883e" text-anchor="middle" >UNIQUE</text><rect x="256" y="20" width="84" height="44" rx="10" fill="#0d1117" stroke="#3fb950" stroke-width="2" /><text x="298" y="47" class="m" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="middle" >DM sent</text><path d="M98 42L124 42" stroke="#8b949e" stroke-width="2" fill="none"/><path d="M115.9 45.9L124 42L115.9 38.1" stroke="#8b949e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M226 42L252 42" stroke="#8b949e" stroke-width="2" fill="none"/><path d="M243.9 45.9L252 42L243.9 38.1" stroke="#8b949e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g opacity=".55"><rect x="0" y="128" width="96" height="44" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2" /><path d="M16 172l6 10 8-10" fill="#0d1117" stroke="#30363d" stroke-width="2"/><text x="48.0" y="155" class="m" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="middle" >same one</text></g><path d="M98 150 C 150 150, 176 120, 176 76" stroke="#f85149" stroke-width="2" fill="none" stroke-dasharray="5 5"/><g stroke="#f85149" stroke-width="3" stroke-linecap="round"><path d="M168 92l16 16M184 92l-16 16"/></g><text x="196" y="106" class="m" font-size="13" font-weight="700" fill="#f85149" text-anchor="start" >duplicate refused</text><text x="196" y="124" class="m" font-size="13" font-weight="400" fill="#f85149" text-anchor="start" >by the database</text><rect x="0" y="196" width="340" height="64" rx="10" fill="#21262d" stroke="none" stroke-width="0" /><text x="16" y="222" class="m" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="start" >hourly reconciler</text><text x="16" y="244" class="m" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start" >frees claims stuck &gt; 30 min with no send</text><circle class="mv" r="5" fill="#f778ba"><animateMotion dur="3s" repeatCount="indefinite" path="M48 42H298"/></circle><text x="0" y="292" class="m" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start" >Meta allows one reply per comment</text></g></svg>
