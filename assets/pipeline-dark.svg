<text x="52" y="44" fill="#8b949e" class="cap">ONE REQUEST, SIX PLACES IT CAN FAIL</text>
<rect x="52" y="74" width="616" height="72" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="74" y="118" fill="#58a6ff" class="n">01</text><text x="128" y="105" fill="#e6edf3" class="h">API + tenant auth</text><text x="128" y="130" fill="#8b949e" class="s">DRF · RBAC · workspace scoping · audit log</text><path d="M360.0 150v20" stroke="#30363d" stroke-width="2"/><path d="M354.0 166l6 7 6-7" fill="none" stroke="#30363d" stroke-width="2"/><rect x="52" y="176" width="616" height="72" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="74" y="220" fill="#58a6ff" class="n">02</text><text x="128" y="207" fill="#e6edf3" class="h">Idempotency guard</text><text x="128" y="232" fill="#8b949e" class="s">row locks + keys · state-aware retry</text><path d="M360.0 252v20" stroke="#30363d" stroke-width="2"/><path d="M354.0 268l6 7 6-7" fill="none" stroke="#30363d" stroke-width="2"/><rect x="52" y="278" width="616" height="72" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="74" y="322" fill="#58a6ff" class="n">03</text><text x="128" y="309" fill="#e6edf3" class="h">Workflow planner</text><text x="128" y="334" fill="#8b949e" class="s">DAG of LLM, image and video nodes</text><path d="M360.0 354v20" stroke="#30363d" stroke-width="2"/><path d="M354.0 370l6 7 6-7" fill="none" stroke="#30363d" stroke-width="2"/><rect x="52" y="380" width="616" height="72" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="74" y="424" fill="#58a6ff" class="n">04</text><text x="128" y="411" fill="#e6edf3" class="h">Provider router</text><text x="128" y="436" fill="#8b949e" class="s">Claude → OpenAI → Gemini → DeepSeek</text><path d="M360.0 456v20" stroke="#30363d" stroke-width="2"/><path d="M354.0 472l6 7 6-7" fill="none" stroke="#30363d" stroke-width="2"/><rect x="52" y="482" width="616" height="72" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="74" y="526" fill="#58a6ff" class="n">05</text><text x="128" y="513" fill="#e6edf3" class="h">Async workers</text><text x="128" y="538" fill="#8b949e" class="s">Celery · late acks · stuck-job reaper</text><path d="M360.0 558v20" stroke="#30363d" stroke-width="2"/><path d="M354.0 574l6 7 6-7" fill="none" stroke="#30363d" stroke-width="2"/><rect x="52" y="584" width="616" height="72" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="74" y="628" fill="#58a6ff" class="n">06</text><text x="128" y="615" fill="#e6edf3" class="h">Usage ledger</text><text x="128" y="640" fill="#8b949e" class="s">tokens · cost · latency per call · credits</text>
