<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="t d"><title id="t">Every token has a price and an owner</title><desc id="d">A schematic usage log with columns provider, tokens, cost, latency and run. Below, two credit buckets: a monthly allowance that is spent first and resets, and purchased credit kept until used.</desc><style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.in{animation:in .5s ease-out backwards}@keyframes in{from{opacity:0;transform:translateY(6px)}}@media (prefers-reduced-motion:reduce){.in{animation:none}.mv{display:none}}</style><rect x="1" y="1" width="758" height="378" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5" /><rect x="1" y="1" width="6" height="378" rx="3" fill="#1a7f37" stroke="none" stroke-width="1.5" /><text x="36" y="50" class="m" font-size="13" font-weight="700" fill="#1a7f37" text-anchor="start" letter-spacing="1.4">03 · TINGG.AI · USAGE &amp; BILLING</text><text x="36" y="92" class="s" font-size="30" font-weight="800" fill="#1f2328" text-anchor="start" >Every token has</text><text x="36" y="128" class="s" font-size="30" font-weight="800" fill="#1f2328" text-anchor="start" >a price and an owner</text><text x="36" y="178" class="s" font-size="17" font-weight="400" fill="#31373d" text-anchor="start" >Each model call records tokens, cost,</text><text x="36" y="204" class="s" font-size="17" font-weight="400" fill="#31373d" text-anchor="start" >latency and the run that spent it.</text><text x="36" y="230" class="s" font-size="17" font-weight="400" fill="#31373d" text-anchor="start" >I found cache tokens billed at zero,</text><text x="36" y="256" class="s" font-size="17" font-weight="400" fill="#31373d" text-anchor="start" >fixed it, and re-priced history safely.</text><rect x="36" y="324" width="158.20000000000002" height="28" rx="14" fill="#eaeef2" stroke="none" stroke-width="0" /><text x="115.10000000000001" y="343" class="m" font-size="13" font-weight="600" fill="#59636e" text-anchor="middle" >append-only ledger</text><rect x="202.20000000000002" y="324" width="126.60000000000001" height="28" rx="14" fill="#eaeef2" stroke="none" stroke-width="0" /><text x="265.5" y="343" class="m" font-size="13" font-weight="600" fill="#59636e" text-anchor="middle" >reconciliation</text><g transform="translate(404 34)"><text x="0" y="14" class="m" font-size="12" font-weight="700" fill="#59636e" text-anchor="start" >provider</text><text x="96" y="14" class="m" font-size="12" font-weight="700" fill="#59636e" text-anchor="start" >tokens</text><text x="170" y="14" class="m" font-size="12" font-weight="700" fill="#59636e" text-anchor="start" >cost</text><text x="232" y="14" class="m" font-size="12" font-weight="700" fill="#59636e" text-anchor="start" >latency</text><text x="304" y="14" class="m" font-size="12" font-weight="700" fill="#59636e" text-anchor="start" >run</text><path d="M0 24H340" stroke="#d0d7de"/><g class="in" style="animation-delay:0.00s"><text x="0" y="48" class="m" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start" >claude</text><rect x="96" y="38" width="44" height="12" rx="3" fill="#d0d7de" stroke="none" stroke-width="0" /><rect x="170" y="38" width="30" height="12" rx="3" fill="#1a7f37" stroke="none" stroke-width="0" opacity=".75"/><rect x="232" y="38" width="40" height="12" rx="3" fill="#d0d7de" stroke="none" stroke-width="0" /><rect x="304" y="38" width="18" height="12" rx="3" fill="#d0d7de" stroke="none" stroke-width="0" /></g><g class="in" style="animation-delay:0.25s"><text x="0" y="78" class="m" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start" >openai</text><rect x="96" y="68" width="36" height="12" rx="3" fill="#d0d7de" stroke="none" stroke-width="0" /><rect x="170" y="68" width="22" height="12" rx="3" fill="#1a7f37" stroke="none" stroke-width="0" opacity=".75"/><rect x="232" y="68" width="28" height="12" rx="3" fill="#d0d7de" stroke="none" stroke-width="0" /><rect x="304" y="68" width="18" height="12" rx="3" fill="#d0d7de" stroke="none" stroke-width="0" /></g><g class="in" style="animation-delay:0.50s"><text x="0" y="108" class="m" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start" >gemini</text><rect x="96" y="98" width="58" height="12" rx="3" fill="#d0d7de" stroke="none" stroke-width="0" /><rect x="170" y="98" width="34" height="12" rx="3" fill="#1a7f37" stroke="none" stroke-width="0" opacity=".75"/><rect x="232" y="98" width="50" height="12" rx="3" fill="#d0d7de" stroke="none" stroke-width="0" /><rect x="304" y="98" width="18" height="12" rx="3" fill="#d0d7de" stroke="none" stroke-width="0" /></g><g class="in" style="animation-delay:0.75s"><text x="0" y="138" class="m" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start" >image</text><rect x="96" y="128" width="24" height="12" rx="3" fill="#d0d7de" stroke="none" stroke-width="0" /><rect x="170" y="128" width="40" height="12" rx="3" fill="#1a7f37" stroke="none" stroke-width="0" opacity=".75"/><rect x="232" y="128" width="56" height="12" rx="3" fill="#d0d7de" stroke="none" stroke-width="0" /><rect x="304" y="128" width="18" height="12" rx="3" fill="#d0d7de" stroke="none" stroke-width="0" /></g><path d="M0 158H340" stroke="#d0d7de"/><text x="0" y="186" class="m" font-size="12" font-weight="700" fill="#59636e" text-anchor="start" letter-spacing="1">CREDITS · APPEND-ONLY LEDGER</text><text x="0" y="212" class="m" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" >monthly allowance  → spent first, resets</text><rect x="0" y="220" width="340" height="16" rx="8" fill="#eaeef2" stroke="none" stroke-width="0" /><rect x="0" y="220" height="16" rx="8" fill="#1a7f37" width="120"><animate attributeName="width" values="340;120" dur="2.2s" fill="freeze"/></rect><text x="0" y="262" class="m" font-size="1