<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="t d"><title id="t">Idea to video, one scene at a time</title><desc id="d">Five stages: idea, script, storyboard, frames, clips. A film strip of three scenes, where each scene starts on the last frame of the scene before it.</desc><style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.in{animation:in .5s ease-out backwards}@keyframes in{from{opacity:0;transform:translateY(6px)}}@media (prefers-reduced-motion:reduce){.in{animation:none}.mv{display:none}}</style><rect x="1" y="1" width="758" height="378" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5" /><rect x="1" y="1" width="6" height="378" rx="3" fill="#8250df" stroke="none" stroke-width="1.5" /><text x="36" y="50" class="m" font-size="13" font-weight="700" fill="#8250df" text-anchor="start" letter-spacing="1.4">02 · TINGG.AI · GENERATIVE VIDEO</text><text x="36" y="92" class="s" font-size="30" font-weight="800" fill="#1f2328" text-anchor="start" >Idea to video,</text><text x="36" y="128" class="s" font-size="30" font-weight="800" fill="#1f2328" text-anchor="start" >one scene at a time</text><text x="36" y="178" class="s" font-size="17" font-weight="400" fill="#31373d" text-anchor="start" >Script, storyboard, frames and clips,</text><text x="36" y="204" class="s" font-size="17" font-weight="400" fill="#31373d" text-anchor="start" >run as async jobs: submit, poll,</text><text x="36" y="230" class="s" font-size="17" font-weight="400" fill="#31373d" text-anchor="start" >store to S3. Scenes can be re-rolled,</text><text x="36" y="256" class="s" font-size="17" font-weight="400" fill="#31373d" text-anchor="start" >versioned, restored or cancelled.</text><rect x="36" y="324" width="63.400000000000006" height="28" rx="14" fill="#eaeef2" stroke="none" stro