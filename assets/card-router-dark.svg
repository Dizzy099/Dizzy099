<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="t d"><title id="t">Do you even need a vector database?</title><desc id="d">Query time in milliseconds against index size. Brute force: 0.17, 0.16, 1.74, 6.43 ms at 24, 240, 2,400 and 24,000 vectors. ChromaDB: 3.96, 4.18, 4.42, 4.40 ms. The lines cross between 2,400 and 24,000 vectors. Top-1 routing accuracy 69% semantic versus 31% lexical, on a small synthetic corpus.</desc><style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.in{animation:in .5s ease-out backwards}@keyframes in{from{opacity:0;transform:translateY(6px)}}@media (prefers-reduced-motion:reduce){.in{animation:none}.mv{display:none}}</style><rect x="1" y="1" width="758" height="378" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5" /><rect x="1" y="1" width="6" height="378" rx="3" fill="#39c5cf" stroke="none" stroke-width="1.5" /><text x="36" y="50" class="m" font-size="13" font-weight="700" fill="#39c5cf" text-anchor="start" letter-spacing="1.4">06 · SIDE PROJECT · MEASURED, NOT ASSUMED</text><text x="36" y="92" class="s" font-size="30" font-weight="800" fill="#e6edf3" text-anchor="start" >Do you even need</text><text x="36" y="128" class="s" font-size="30" font-weight="800" fill="#e6edf3" text-anchor="start" >a vector database?</text><text x="36" y="178" class="s" font-size="17" font-weight="400" fill="#c9d1d9" text-anchor="start" >Routes document chunks to a taxonomy</text><text x="36" y="204" class="s" font-size="17" font-weight="400" fill="#c9d1d9" text-anchor="start" >with embeddings, then benchmarks brute</text><text x="36" y="230" class="s" font-size="17" font-weight="400" fill="#c9d1d9" text-anchor="start" >force against ChromaDB. Below a few</text><text x="36" y="256" class="s" font-size="17" font-weight="400" fill="#c9d1d9" text-anchor="start" >thousand vectors, brute force wins.</text><rect x="36" y="324" width="63.400000000000006" height="28" rx="14" fill="#21262d" stroke="none" stroke-width="0" /><text x="67.7" y="343" class="m" font-size="13" font-weight="600" fill="#8b949e" text-anchor="middle" >Python</text><rect x="107.4" y="324" width="79.2" height="28" rx="14" fill="#21262d" stroke="none" stroke-width="0" /><text x="147.0" y="343" class="m" font-size="13" font-weight="600" fill="#8b949e" text-anchor="middle" >ChromaDB</text><rect x="194.60000000000002" y="324" width="63.400000000000006" height="28" rx="14" fill="#21262d" stroke="none" stroke-width="0" /><text x="226.3" y="343" class="m" font-size="13" font-weight="600" fill="#8b949e" text-anchor="middle" >MiniLM</text><g transform="translate(404 34)"><rect x="240" y="26" width="98" height="204" rx="0" fill="#39c5cf" stroke="none" stroke-width="0" opacity=".10"/><text x="289" y="222" class="m" font-size="12" font-weight="700" fill="#39c5cf" text-anchor="middle" >crossover</text><path d="M36 230H340" stroke="#21262d"/><text x="28" y="234.0" class="m" font-size="12" font-weight="400" fill="#8b949e" text-anchor="end" >0</text><path d="M36 174H340" stroke="#21262d"/><text x="28" y="178.0" class="m" font-size="12" font-weight="400" fill="#8b949e" text-anchor="end" >2</text><path d="M36 118H340" stroke="#21262d"/><text x="28" y="122.0" class="m" font-size="12" font-weight="400" fill="#8b949e" text-anchor="end" >4</text><path d="M36 62H340" stroke="#21262d"/><text x="28" y="66.0" class="m" font-size="12" font-weight="400" fill="#8b949e" text-anchor="end" >6</text><text x="44" y="252" class="m" font-size="12" font-weight="600" fill="#8b949e" text-anchor="middle" >24</text><text x="142" y="252" class="m" font-size="12" font-weight="600" fill="#8b949e" text-anchor="middle" >240</text><text x="240" y="252" class="m" font-size="12" font-weight="600" fill="#8b949e" text-anchor="middle" >2.4k</text><text x="338" y="252" class="m" font-size="12" font-weight="600" fill="#8b949e" text-anchor="middle" >24k</text><text x="190" y="274" class="m" font-size="12" font-weight="400" fill="#8b949e" text-anchor="middle" >vectors in the index (log scale)</text><text x="0" y="18" class="m" font-size="12" font-weight="700" fill="#8b949e" text-anchor="start" >query ms</text><polyline points="44,119.1 142,113.0 240,106.2 338,106.8" fill="none" stroke="#f0883e" stroke-width="3" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0"><animate attributeName="stroke-dashoffset" from="1" to="0" dur="1.6s" fill="freeze"/></polyline><circle cx="44" cy="119.1" r="4.5" fill="#f0883e"/><circle cx="142" cy="113.0" r="4.5" fill="#f0883e"/><circle cx="240" cy="106.2" r="4.5" fill="#f0883e"/><circle cx="338" cy="106.8" r="4.5" fill="#f0883e"/><text x="150" y="100.96000000000001" class="m" font-size="13" font-weight="700" fill="#f0883e" text-anchor="start" >chromadb</text><polyline points="44,225.2 142,225.5 240,181.3 338,50.0" fill="none" stroke="#39c5cf" stroke-width="3" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0"><animate attributeName="stroke-dashoffset" from="1" to="0" dur="1.6s" fill="freeze"/></polyline><circle cx="44" cy="225.2" r="4.5" fill="#39c5cf"/><circle cx="142" cy="225.5" r="4.5" fill="#39c5cf"/><circle cx="240" cy="181.3" r="4.5" fill="#39c5cf"/><circle cx="338" cy="50.0" r="4.5" fill="#39c5cf"/><text x="326" y="54.96000000000001" class="m" font-size="13" font-weight="700" fill="#39c5cf" text-anchor="end" >brute force</text><text x="0" y="304" class="m" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="start" >top-1 routing: 69% semantic vs 31% lexical</text></g></svg>
