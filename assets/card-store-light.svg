<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="t d"><title id="t">A live store, made fast and safe</title><desc id="d">Lighthouse performance on catalogue pages rose from 70 to 94. Layout shift fell from 0.75 to 0.024 by reserving grid space before products load.</desc><style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.in{animation:in .5s ease-out backwards}@keyframes in{from{opacity:0;transform:translateY(6px)}}@media (prefers-reduced-motion:reduce){.in{animation:none}.mv{display:none}}</style><rect x="1" y="1" width="758" height="378" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5" /><rect x="1" y="1" width="6" height="378" rx="3" fill="#bc4c00" stroke="none" stroke-width="1.5" /><text x="36" y="50" class="m" font-size="13" font-weight="700" fill="#bc4c00" text-anchor="start" letter-spacing="1.4">05 · FREELANCE · LIVE E-COMMERCE</text><text x="36" y="92" class="s" font-size="30" font-weight="800" fill="#1f2328" text-anchor="start" >A live store,</text><text x="36" y="128" class="s" font-size="30" font-weight="800" fill="#1f2328" text-anchor="start" >made fast and safe</text><text x="36" y="178" class="s" font-size="17" font-weight="400" fill="#31373d" text-anchor="start" >PhonePe payments, Shiprocket tracking,</text><text x="36" y="204" class="s" font-size="17" font-weight="400" fill="#31373d" text-anchor="start" >server-side pricing rules. Closed a</text><text x="36" y="230" class="s" font-size="17" font-weight="400" fill="#31373d" text-anchor="start" >NoSQL-injection path to admin.</text><text x="36" y="256" class="s" font-size="17" font-weight="400" fill="#31373d" text-anchor="start" >134 commits across 3 repos.</text><rect x="36" y="324" width="71.30000000000001" height="28" rx="14" fill="#eaeef2" stroke="none" stroke-width="0" /><tex