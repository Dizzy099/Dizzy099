<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 516" width="760" height="516" role="img" aria-labelledby="t d"><title id="t">Bug hunts: six production bugs and their fixes</title><desc id="d">14 images instead of 7: Double-click race. Row locks and idempotency keys; retries made safe. Every video request: 500: A 480 s poll ran in a 120 s web worker. Moved it back onto Celery. Uploads stuck “processing”: Queue nobody consumed + early acks. Late acks and a stuck-job reaper. Costs drifting from prices: Cache tokens priced at zero. Fixed, then re-priced history, dry run first. Only the newest rule fires: Wrong sort order. Tests proven to fail if the bug ever comes back. 5 auth flaws, my own feature: Found in my own pre-release review; reported with fixes before merge.</desc><style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.in{animation:in .5s ease-out backwards}@keyframes in{from{opacity:0;transform:translateY(6px)}}@media (prefers-reduced-motion:reduce){.in{animation:none}.mv{display:none}}</style><rect x="1" y="1" width="758" height="514" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5" /><text x="36" y="50" class="m" font-size="13" font-weight="700" fill="#cf222e" text-anchor="start" letter-spacing="1.4">BUG HUNTS · SYMPTOM → ROOT CAUSE → FIX</text><g class="in" style="animation-delay:0.00s"><rect x="36" y="78" width="334" height="124" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" /><rect x="36" y="92" width="4" height="30" rx="2" fill="#cf222e" stroke="none" stroke-width="0" /><text x="56" y="114" class="s" font-size="20" font-weight="800" fill="#1f2328" text-anchor="start" >14 images instead of 7</text><text x="56" y="148" class="m" font-size="11" font-weight="800" fill="#1a7f37" text-anchor="start" letter-spacing="1.2">FIX</text><text x="88" y="148" class="s" font-size="15" font-weight="400" fill="#31373d" text-anchor="start" >Double-click race. Row locks and</text><text x="88" y="172" class="s" font-size="15" font-weight="400" fill="#31373d" text-anchor="start" >idempotency keys; retries made safe.</text></g><g class="in" style="animation-delay:0.12s"><rect x="390" y="78" width="334" height="124" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" /><rect x="390" y="92" width="4" height="30" rx="2" fill="#cf222e" stroke="none" stroke-width="0" /><text x="410" y="114" class="s" font-size="20" font-weight="800" fill="#1f2328" text-anchor="start" >Every video request: 500</text><text x="410" y="148" class="m" font-size="11" font-weight="800" fill="#1a7f37" text-anchor="start" letter-spacing="1.2">FIX</text><text x="442" y="148" class="s" font-size="15" font-weight="400" fill="#31373d" text-anchor="start" >A 480 s poll ran in a 120 s web</text><text x="442" y="172" class="s" font-size="15" font-weight="400" fill="#31373d" text-anchor="start" >worker. Moved it back onto Celery.</text></g><g class="in" style="animation-delay:0.24s"><rect x="36" y="218" width="334" height="124" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" /><rect x="36" y="232" width="4" height="30" rx="2" fill="#cf222e" stroke="none" stroke-width="0" /><text x="56" y="254" class="s" font-size="20" font-weight="800" fill="#1f2328" text-anchor="start" >Uploads stuck “processing”</text><text x="56" y="288" class="m" font-size="11" font-weight="800" fill="#1a7f37" text-anchor="start" letter-spacing="1.2">FIX</text><text x="88" y="288" class="s" font-size="15" font-weight="400" fill="#31373d" text-anchor="start" >Queue nobody consumed + early acks.</text><text x="88" y="312" class="s" font-size="15" font-weight="400" fill="#31373d" text-anchor="start" >Late acks and a stuck-job reaper.</text></g><g class="in" style="animation-delay:0.36s"><rect x="390" y="218" width="334" height="124" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" /><rect x="390" y="232" width="4" height="30" rx="2" fill="#cf222e" stroke="none" stroke-width="0" /><text x="410" y="254" class="s" font-size="20" font-weight="800" fill="#1f2328" text-anchor="start" >Costs drifting from prices</text><text x="410" y="288" class="m" font-size="11" font-weight="800" fill="#1a7f37" text-anchor="start" letter-spacing="1.2">FIX</text><text x="442" y="288" class="s" font-size="15" font-weight="400" fill="#31373d" text-anchor="start" >Cache tokens priced at zero. Fixed,</text><text x="442" y="312" class="s" font-size="15" font-weight="400" fill="#31373d" text-anchor="start" >then re-priced history, dry run first.</text></g><g class="in" style="animation-delay:0.48s"><rect x="36" y="358" width="334" height="124" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" /><rect x="36" y="372" width="4" height="30" rx="2" fill="#cf222e" stroke="none" stroke-width="0" /><text x="56" y="394" class="s" font-size="20" font-weight="800" fill="#1f2328" text-anchor="start" >Only the newest rule fires</text><text x="56" y="428" class="m" font-size="11" font-weight="800" fill="#1a7f37" text-anchor="start" letter-spacing="1.2">FIX</text><text x="88" y="428" class="s" font-size="15" font-weight="400" fill="#31373d" text-anchor="start" >Wrong sort order. Tests proven to</text><text x="88" y="452" class="s" font-size="15" font-weight="400" fill="#31373d" text-anchor="start" >fail if the bug ever comes back.</text></g><g class="in" style="animation-delay:0.60s"><rect x="390" y="358" width="334" height="124" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" /><rect x="390" y="372" width="4" height="30" rx="2" fill="#cf222e" stroke="none" stroke-width="0" /><text x="410" y="394" class="s" font-size="20" font-weight="800" fill="#1f2328" text-anchor="start" >5 auth flaws, my own feature</text><text x="410" y="428" class="m" font-size="11" font-weight="800" fill="#1a7f37" text-anchor="start" letter-spacing="1.2">FIX</text><text x="442" y="428" class="s" font-size="15" font-weight="400" fill="#31373d" text-anchor="start" >Found in my own pre-release review;</text><text x="442" y="452" class="s" font-size="15" font-weight="400" fill="#31373d" text-anchor="start" >reported with fixes before merge.</text></g></svg>
