<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 378" width="760" height="378" role="img" aria-labelledby="t d">
<title id="t">Awanish Mishra, backend engineer for AI products</title>
<desc id="d">A terminal tracing one AI workflow request: idempotency lock, DAG plan, provider fallback from Claude to OpenAI, Celery queue, and usage metering, ending in HTTP 200.</desc>
<style>
  text { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; font-size: 17px; }
  .ln { animation: in .35s ease-out backwards; }
  .cur { animation: blink 1.1s steps(1) infinite; }
  @keyframes in { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .ln { animation: none; } .cur { animation: none; } }
</style>
<rect x="1" y="1" width="758" height="376" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<path d="M1 13a12 12 0 0 1 12-12h734a12 12 0 0 1 12 12v27H1z" fill="#f6f8fa"/>
<line x1="1" y1="40" x2="759" y2="40" stroke="#d0d7de"/>
<circle cx="24" cy="21" r="6" fill="#ff5f57"/><circle cx="44" cy="21" r="6" fill="#febc2e"/><circle cx="64" cy="21" r="6" fill="#28c840"/>
<text x="380.0" y="26" text-anchor="middle" fill="#59636e" style="font-size:14px">awanish@prod: ~</text>
<text class="ln" style="animation-delay:0.25s" x="36" y="78" xml:space="preserve"><tspan fill="#59636e">$ </tspan><tspan fill="#1f2328">whoami</tspan></text>
<text class="ln" style="animation-delay:0.57s" x="36" y="105" xml:space="preserve"><tspan fill="#0969da">Awanish Mishra</tspan><tspan fill="#1f2328"> · backend engineer, AI products</tspan></text>
<text class="ln" style="animation-delay:1.21s" x="36" y="159" xml:space="preserve"><tspan fill="#59636e">$ </tspan><tspan fill="#1f2328">trace </tspan><tspan fill="#9a6700">POST /workflows/run</tspan></text>
<text class="ln" style="animation-delay:1.53s" x="36" y="186" xml:space="preserve"><tspan fill="#59636e">  lock   </tspan><tspan fill="#1f2328">idempotency key held         </tspan><tspan fill="#1a7f37">ok</tspan></text>
<text class="ln" style="animation-delay:1.85s" x="36" y="213" xml:space="preserve"><tspan fill="#59636e">  plan   </tspan><tspan fill="#1f2328">DAG: llm → image → video     </tspan><tspan fill="#1a7f37">ok</tspan></text>
<text class="ln" style="animation-delay:2.17s" x="36" y="240" xml:space="preserve"><tspan fill="#59636e">  route  </tspan><tspan fill="#1f2328">claude 503 → openai          </tspan><tspan fill="#9a6700">fallback</tspan></text>
<text class="ln" style="animation-delay:2.49s" x="36" y="267" xml:space="preserve"><tspan fill="#59636e">  queue  </tspan><tspan fill="#1f2328">celery, acks_late            </tspan><tspan fill="#1a7f37">ok</tspan></text>
<text class="ln" style="animation-delay:2.81s" x="36" y="294" xml:space="preserve"><tspan fill="#59636e">  meter  </tspan><tspan fill="#1f2328">tokens · cost · latency      </tspan><tspan fill="#1a7f37">logged</tspan></text>
<text class="ln" style="animation-delay:3.13s" x="36" y="321" xml:space="preserve"><tspan fill="#1a7f37">✓ 200 </tspan><tspan fill="#59636e">correct on the bad day, not just the demo</tspan></text>
<rect class="cur" x="515" y="306" width="10" height="19" fill="#0969da"/>
</svg>
